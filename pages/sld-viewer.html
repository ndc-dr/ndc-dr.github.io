<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data center single line diagram</title>
<style>
:root{--desk:#cfd4dc;--panel:rgba(255,255,255,.94);--ink:#1b2733;--mut:#5b6878;--line:#b4bcc8;--btn:#f1f3f6;--acc:#0a62c9}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--desk);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#stage{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#stage.drag{cursor:grabbing}
#img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;background:#fff;-webkit-user-drag:none}
#img.px{image-rendering:pixelated}
.bar{position:fixed;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:8px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#top{top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px}
h1{margin:0 auto 0 4px;font-size:15px;font-weight:600}
h1 small{color:var(--mut);font-weight:400;margin-left:8px;font-size:13px}
button{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:6px;min-width:34px;height:34px;padding:0 10px;cursor:pointer}
button:hover{background:#e3e8ee}
button:active{background:#d5dce6}
button.on{border-color:var(--acc);color:var(--acc)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=range]{width:min(26vw,200px);accent-color:var(--acc);margin:0 4px}
output{min-width:54px;text-align:center;color:var(--mut);font-variant-numeric:tabular-nums}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
#map{right:10px;bottom:max(10px,env(safe-area-inset-bottom));border:0;outline:1px solid var(--line);overflow:hidden;background:#fff;touch-action:none;cursor:crosshair}
#mimg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
#view{position:absolute;border:2px solid var(--acc);background:rgba(10,98,201,.15);pointer-events:none}
#hint{position:fixed;left:10px;bottom:max(10px,env(safe-area-inset-bottom));color:var(--mut);font-size:12px;background:var(--panel);border:1px solid var(--line);padding:5px 9px;border-radius:6px;pointer-events:none}
#msg{position:fixed;inset:0;z-index:4;display:grid;place-items:center;text-align:center;padding:20px;white-space:pre-line;color:var(--mut);pointer-events:none}
@media (hover:none){#hint{display:none}}
</style>
</head>
<body>
<div id="stage"><img id="img" alt="Single line diagram of the data center electrical layout" draggable="false" decoding="async"></div>
<div id="msg">Loading diagram…</div>
<div id="top" class="bar">
  <h1>Data center single line diagram<small>Full phase</small></h1>
  <button id="out" aria-label="Zoom out" title="Zoom out (−)">−</button>
  <input id="zr" type="range" min="0" max="1000" value="0" aria-label="Zoom level">
  <button id="in" aria-label="Zoom in" title="Zoom in (+)">+</button>
  <output id="pct">–</output>
  <span class="sep"></span>
  <button id="fit" title="Fit whole diagram (0)">Fit</button>
  <button id="one" title="Actual pixels (1)">100%</button>
  <button id="mapb" class="on" title="Show or hide overview map (M)">Map</button>
  <button id="full" title="Full screen (F)">Full screen</button>
</div>
<div id="map" class="bar" hidden><img id="mimg" alt=""><div id="view"></div></div>
<div id="hint">Drag to pan. Scroll or pinch to zoom. Double-click to zoom in. Keys: + − 0 1 M F and arrows.</div>
<script>
(()=>{
const SRC="../assets/images/SLD Full Phase.png"; // path relative to this HTML file
const MAXS=4;                                    // max zoom = 400% of native pixels
const $=id=>document.getElementById(id);
const stage=$('stage'),img=$('img'),mimg=$('mimg'),map=$('map'),view=$('view'),bar=$('top'),msg=$('msg'),zr=$('zr'),pct=$('pct'),full=$('full');
let iw=0,ih=0,vw=0,vh=0,T=0,s=1,x=0,y=0,MW=220;

const fitS=()=>Math.min((vw-32)/iw,(vh-T-16)/ih);
const lo=()=>fitS()*.5;
const C=()=>[vw/2,T+(vh-T)/2];
function measure(){vw=stage.clientWidth;vh=stage.clientHeight;T=bar.getBoundingClientRect().bottom+8;}

function clamp(){
  const w=iw*s,h=ih*s,ah=vh-T;
  x=w<=vw-32?(vw-w)/2:Math.min(16,Math.max(vw-w-16,x));
  y=h<=ah-16?T+(ah-h)/2:Math.min(T,Math.max(vh-h-16,y));
}
function apply(){
  clamp();
  img.style.transform=`translate(${x}px,${y}px) scale(${s})`;
  img.classList.toggle('px',s>=2);
  pct.textContent=(s<.1?(s*100).toFixed(1):Math.round(s*100))+'%';
  const l=lo();zr.value=1000*Math.log(s/l)/Math.log(MAXS/l);
  const f=MW/iw,L=Math.max(0,-x/s),U=Math.max(0,-y/s),R=Math.min(iw,(vw-x)/s),B=Math.min(ih,(vh-y)/s);
  view.style.cssText=`left:${L*f}px;top:${U*f}px;width:${Math.max(3,(R-L)*f)}px;height:${Math.max(3,(B-U)*f)}px`;
}
function zoomAt(n,cx,cy){
  n=Math.min(MAXS,Math.max(lo(),n));const k=n/s;
  x=cx-(cx-x)*k;y=cy-(cy-y)*k;s=n;apply();
}
function fit(){s=fitS();x=(vw-iw*s)/2;y=T+(vh-T-ih*s)/2;apply();}

// Mouse wheel / trackpad pinch: zoom around the cursor
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const d=e.deltaMode===1?e.deltaY*16:e.deltaY;
  zoomAt(s*Math.exp(-d*(e.ctrlKey?.01:.0018)),e.clientX,e.clientY);
},{passive:false});
stage.addEventListener('dblclick',e=>zoomAt(e.shiftKey?s/2:s*2,e.clientX,e.clientY));

// Drag to pan, two-finger pinch to zoom
const P=new Map();let pinch=null;
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch=null;stage.classList.add('drag');});
stage.addEventListener('pointermove',e=>{
  const p=P.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(P.size===1){x+=dx;y+=dy;apply();}
  else if(P.size===2){
    const[a,b]=[...P.values()],d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
    if(pinch){x+=cx-pinch.cx;y+=cy-pinch.cy;zoomAt(s*d/pinch.d,cx,cy);}
    pinch={d,cx,cy};
  }
});
const up=e=>{P.delete(e.pointerId);pinch=null;if(!P.size)stage.classList.remove('drag');};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
addEventListener('gesturestart',e=>e.preventDefault());

// Overview map: click or drag to jump
const go=e=>{
  const r=map.getBoundingClientRect(),[cx,cy]=C();
  x=cx-(e.clientX-r.left)/r.width*iw*s;y=cy-(e.clientY-r.top)/r.height*ih*s;apply();
};
map.addEventListener('pointerdown',e=>{map.setPointerCapture(e.pointerId);go(e);});
map.addEventListener('pointermove',e=>{if(e.buttons)go(e);});

// Toolbar
$('in').onclick=()=>zoomAt(s*1.5,...C());
$('out').onclick=()=>zoomAt(s/1.5,...C());
$('fit').onclick=fit;
$('one').onclick=()=>zoomAt(1,...C());
zr.oninput=()=>{const l=lo();zoomAt(l*Math.pow(MAXS/l,zr.value/1000),...C());};
$('mapb').onclick=e=>{map.hidden=!map.hidden;e.currentTarget.classList.toggle('on',!map.hidden);};
if(!document.documentElement.requestFullscreen)full.hidden=true;
full.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();

// Keyboard
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||!iw)return;
  const k=e.key,st=e.shiftKey?400:100;
  if(e.target===zr&&k.startsWith('Arrow'))return;
  if(k==='+'||k==='=')$('in').click();
  else if(k==='-'||k==='_')$('out').click();
  else if(k==='0')fit();
  else if(k==='1')$('one').click();
  else if(k==='m'||k==='M')$('mapb').click();
  else if(k==='f'||k==='F')full.click();
  else if(k==='ArrowLeft'){x+=st;apply();}
  else if(k==='ArrowRight'){x-=st;apply();}
  else if(k==='ArrowUp'){y+=st;apply();}
  else if(k==='ArrowDown'){y-=st;apply();}
  else return;
  e.preventDefault();
});

addEventListener('resize',()=>{
  if(!iw)return;
  const wasFit=Math.abs(s/fitS()-1)<.01;
  measure();wasFit?fit():apply();
});

// Load
img.onload=()=>{
  iw=img.naturalWidth;ih=img.naturalHeight;
  MW=innerWidth<700?140:220;
  map.style.width=MW+'px';map.style.height=(MW*ih/iw)+'px';
  map.hidden=innerWidth<700;$('mapb').classList.toggle('on',!map.hidden);
  msg.hidden=true;measure();fit();
};
img.onerror=()=>{msg.textContent="Couldn’t load the diagram from:\n"+img.src+"\n\nCheck the file name (case-sensitive on GitHub Pages) and that the image is committed to the repo.";};
measure();
img.src=mimg.src=encodeURI(SRC);
})();
</script>
</body>
</html>
